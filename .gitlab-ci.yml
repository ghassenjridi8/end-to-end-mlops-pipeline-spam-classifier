stages:
  - lint
  - train
  - evaluate

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install ruff
    - ruff check src/

train:
  stage: train
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - python src/train.py
  artifacts:
    paths:
      - model.pkl

evaluate:
  stage: evaluate
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - python src/evaluate.py