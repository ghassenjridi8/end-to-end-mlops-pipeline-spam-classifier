stages:
  - lint
  - train
  - evaluate

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install ruff
    - ruff check src/

train:
  stage: train
  image: google/cloud-sdk:slim

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://iam.googleapis.com/projects/773233738701/locations/global/workloadIdentityPools/gitlab-pool/providers/gitlab-provider

  script:
    - echo "$GITLAB_OIDC_TOKEN" > /tmp/gitlab-oidc-token

    - gcloud iam workload-identity-pools create-cred-config projects/773233738701/locations/global/workloadIdentityPools/gitlab-pool/providers/gitlab-provider --service-account=gitlab-ci@project-46677838-a710-49db-be5.iam.gserviceaccount.com --output-file=/tmp/gcp-credentials.json --credential-source-file=/tmp/gitlab-oidc-token

    - gcloud auth login --cred-file=/tmp/gcp-credentials.json

    - gcloud auth list

    - gcloud storage cat gs://spam-classifier-mlops-project-ghassen/data/messages.csv

evaluate:
  stage: evaluate
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - python src/evaluate.py