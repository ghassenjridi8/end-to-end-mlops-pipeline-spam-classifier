# Only run branch (and tag) pipelines; no separate merge request pipelines: the branch pipeline already shows up in the MR.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always




stages:
  - terraform_plan
  - terraform_apply
  - lint
  - train
  - evaluate
  - build
  - deploy
  - integration_tests
  #prod (after manual approval)
  - approve_prod
  - terraform_apply_prod
  - promote
  - deploy_prod
  - integration_tests_prod

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""


#####Terraform#######

# Shared setup for all Terraform jobs: install Terraform, log in to GCP via WIF, init
# Each job sets TF_SERVICE_ACCOUNT (which SA to log in as) and GITLAB_TOKEN:
.terraform_base:
  image: google/cloud-sdk:slim
  variables:
    TF_VERSION: "1.17.2"
    TF_IN_AUTOMATION: "true"
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: $GCP_WIF_AUDIENCE
  before_script:
    # install Terraform (same version as locally)
    - apt-get update && apt-get install -y unzip
    - curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
    - unzip -q /tmp/terraform.zip -d /usr/local/bin
    - terraform version
    # log in to GCP as the job's service account
    - echo "$GITLAB_OIDC_TOKEN" > /tmp/gitlab-oidc-token
    - gcloud iam workload-identity-pools create-cred-config $GCP_WIF_PROVIDER --service-account=$TF_SERVICE_ACCOUNT --output-file=/tmp/gcp-credentials.json --credential-source-file=/tmp/gitlab-oidc-token
    - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-credentials.json
    - gcloud auth login --cred-file=/tmp/gcp-credentials.json
    # init against the remote state
    - cd $TF_ENV_DIR
    - terraform init -input=false
  rules:
    - changes:
        - infra/**/*
        - .gitlab-ci.yml



terraform_plan_prod:
  extends: .terraform_base
  stage: terraform_plan
  environment:
    name: production
    action: prepare
  variables:
    TF_ENV_DIR: infra/envs/prod
    TF_SERVICE_ACCOUNT: $TF_PLAN_SERVICE_ACCOUNT
    GITLAB_TOKEN: $TF_GITLAB_READ_TOKEN
  script:
    - terraform plan -input=false -lock=false -out=plan.tfplan
  artifacts:
    paths:
      - infra/envs/prod/plan.tfplan
    expire_in: 1 week

terraform_plan_staging:
  extends: .terraform_base
  stage: terraform_plan
  environment:
    name: staging
    action: prepare
  variables:
    TF_ENV_DIR: infra/envs/staging
    TF_SERVICE_ACCOUNT: $TF_PLAN_SERVICE_ACCOUNT
    GITLAB_TOKEN: $TF_GITLAB_READ_TOKEN
  script:
    - terraform plan -input=false -lock=false -out=plan.tfplan
  artifacts:
    paths:
      - infra/envs/staging/plan.tfplan
    expire_in: 1 week




terraform_apply_staging:
  extends: .terraform_base
  stage: terraform_apply
  environment:
    name: staging
  variables:
    TF_ENV_DIR: infra/envs/staging
    TF_SERVICE_ACCOUNT: $TF_APPLY_SERVICE_ACCOUNT
  script:
    # GitLab write token from this environment's Secret Manager (only terraform-apply can read it)
    - GITLAB_TOKEN="$(gcloud secrets versions access latest --secret=terraform-gitlab-token --project=$GCP_PROJECT_ID)"
    - export GITLAB_TOKEN
    - terraform apply -input=false plan.tfplan
  dependencies:
    - terraform_plan_staging
  resource_group: terraform-staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - infra/**/*
        - .gitlab-ci.yml



lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install ruff
    - ruff check src/

train:
  stage: train
  image: google/cloud-sdk:slim
  environment:
      name: staging
      action: prepare

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: $GCP_WIF_AUDIENCE

  script:
    - echo "$GITLAB_OIDC_TOKEN" > /tmp/gitlab-oidc-token

    - gcloud iam workload-identity-pools create-cred-config $GCP_WIF_PROVIDER --service-account=$GCP_SERVICE_ACCOUNT --output-file=/tmp/gcp-credentials.json --credential-source-file=/tmp/gitlab-oidc-token

    - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-credentials.json

    - gcloud auth login --cred-file=/tmp/gcp-credentials.json

    - apt-get update && apt-get install -y python3-pip

    - pip3 install --break-system-packages -r requirements.txt

    - python3 src/train.py --dataset gs://$GCS_BUCKET/data/messages.csv --output model.pkl

    - gcloud storage cp model.pkl gs://$GCS_BUCKET/models/$CI_COMMIT_SHA/model.pkl

  artifacts:
    paths:
      - model.pkl

evaluate:
  stage: evaluate
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - python src/evaluate.py


build:
  stage: build
  image: google/cloud-sdk:slim
  environment:
        name: staging
        action: prepare
  services:
    - docker:27-dind

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: $GCP_WIF_AUDIENCE

  script:
    - apt-get update && apt-get install -y docker.io

    - echo "$GITLAB_OIDC_TOKEN" > /tmp/gitlab-oidc-token

    - gcloud iam workload-identity-pools create-cred-config $GCP_WIF_PROVIDER --service-account=$GCP_SERVICE_ACCOUNT --output-file=/tmp/gcp-credentials.json --credential-source-file=/tmp/gitlab-oidc-token

    - gcloud auth login --cred-file=/tmp/gcp-credentials.json

    - docker info

    - gcloud auth configure-docker $GCP_REGION-docker.pkg.dev --quiet

    - docker build -t $GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$IMAGE_NAME:$CI_COMMIT_SHA .

    - docker push $GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$IMAGE_NAME:$CI_COMMIT_SHA

    # record the exact pushed image (by digest) for the promote job
    - echo "STAGING_IMAGE=$(docker inspect --format='{{index .RepoDigests 0}}' $GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$IMAGE_NAME:$CI_COMMIT_SHA)" > build.env

  artifacts:
    reports:
      dotenv: build.env


deploy_staging:
  stage: deploy
  image: google/cloud-sdk:slim
  environment:
      name: staging
      

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: $GCP_WIF_AUDIENCE

  script:
    - echo "$GITLAB_OIDC_TOKEN" > /tmp/gitlab-oidc-token

    - gcloud iam workload-identity-pools create-cred-config $GCP_WIF_PROVIDER --service-account=$GCP_SERVICE_ACCOUNT --output-file=/tmp/gcp-credentials.json --credential-source-file=/tmp/gitlab-oidc-token

    - gcloud auth login --cred-file=/tmp/gcp-credentials.json

    - gcloud run deploy $CLOUD_RUN_SERVICE --project=$GCP_PROJECT_ID --image=$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$IMAGE_NAME:$CI_COMMIT_SHA --region=$GCP_REGION --platform=managed --service-account=$CLOUD_RUN_SERVICE_ACCOUNT

    - echo "SERVICE_URL=$(gcloud run services describe $CLOUD_RUN_SERVICE --project=$GCP_PROJECT_ID --region=$GCP_REGION --format='value(status.url)')" > deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
  
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

integration_tests_staging:
  stage: integration_tests
  image: curlimages/curl:latest
  environment:
    name: staging
    action: verify
  dependencies:
    - deploy_staging

  script:
    # Health check
    - curl --fail "$SERVICE_URL/health"

    # Prediction test
    - >
      curl --fail -X POST
      "$SERVICE_URL/predict"
      -H "Content-Type: application/json"
      -d '{"texts":["Congratulations! You won a free prize","Hey, are we still meeting tomorrow?"]}'

  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH



#prod (after manual approval)
approve_prod:
  stage: approve_prod
  image: alpine:latest
  script:
    - echo "Staging passed. Promoting commit $CI_COMMIT_SHORT_SHA to production."
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual



terraform_apply_prod:
  extends: .terraform_base
  stage: terraform_apply_prod
  environment:
    name: production
  variables:
    TF_ENV_DIR: infra/envs/prod
    TF_SERVICE_ACCOUNT: $TF_APPLY_SERVICE_ACCOUNT
  script:
     # GitLab write token from this environment's Secret Manager (only terraform-apply can read it)
    - GITLAB_TOKEN="$(gcloud secrets versions access latest --secret=terraform-gitlab-token --project=$GCP_PROJECT_ID)"
    - export GITLAB_TOKEN
    - terraform apply -input=false plan.tfplan
  dependencies:
    - terraform_plan_prod
  resource_group: terraform-prod
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - infra/**/*
        - .gitlab-ci.yml
      



promote_image:
  stage: promote
  image: google/cloud-sdk:slim
  environment:
    name: production
    action: prepare
  variables:
    CRANE_VERSION: "v0.20.2"
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: $GCP_WIF_AUDIENCE
  dependencies:
    - build
  script:
    # log in to GCP as prod's gitlab-ci SA (reader on staging repo, writer on prod)
    - echo "$GITLAB_OIDC_TOKEN" > /tmp/gitlab-oidc-token
    - gcloud iam workload-identity-pools create-cred-config $GCP_WIF_PROVIDER --service-account=$GCP_SERVICE_ACCOUNT --output-file=/tmp/gcp-credentials.json --credential-source-file=/tmp/gitlab-oidc-token
    - gcloud auth login --cred-file=/tmp/gcp-credentials.json

    # install crane (copies images between registries without pulling them locally)
    - curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" | tar -xz -C /usr/local/bin crane
    - crane auth login $GCP_REGION-docker.pkg.dev -u oauth2accesstoken -p "$(gcloud auth print-access-token)"

    # copy the exact tested image (by digest) from staging's registry to prod's
    - PROD_IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$IMAGE_NAME:$CI_COMMIT_SHA"
    - echo "Promoting $STAGING_IMAGE -> $PROD_IMAGE"
    - crane copy "$STAGING_IMAGE" "$PROD_IMAGE"
    - crane digest "$PROD_IMAGE"
      # pass the promoted image (by digest) to deploy_prod
    - echo "PROD_IMAGE=$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$IMAGE_NAME@$(crane digest "$PROD_IMAGE")" > promote.env
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  artifacts:
    reports:
      dotenv: promote.env



deploy_prod:
  stage: deploy_prod
  image: google/cloud-sdk:slim
  environment:
      name: production
  dependencies:
    - promote_image  

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: $GCP_WIF_AUDIENCE

  script:
    - echo "$GITLAB_OIDC_TOKEN" > /tmp/gitlab-oidc-token

    - gcloud iam workload-identity-pools create-cred-config $GCP_WIF_PROVIDER --service-account=$GCP_SERVICE_ACCOUNT --output-file=/tmp/gcp-credentials.json --credential-source-file=/tmp/gitlab-oidc-token

    - gcloud auth login --cred-file=/tmp/gcp-credentials.json

    - gcloud run deploy $CLOUD_RUN_SERVICE --project=$GCP_PROJECT_ID --image=$PROD_IMAGE --region=$GCP_REGION --platform=managed --service-account=$CLOUD_RUN_SERVICE_ACCOUNT

    - echo "SERVICE_URL=$(gcloud run services describe $CLOUD_RUN_SERVICE --project=$GCP_PROJECT_ID --region=$GCP_REGION --format='value(status.url)')" > deploy.env
  artifacts:
    reports:
      dotenv: deploy.env
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH



integration_tests_prod:
  stage: integration_tests_prod
  image: curlimages/curl:latest
  environment:
    name: production
    action: verify
  dependencies:
    - deploy_prod

  script:
    # Health check
    - curl --fail "$SERVICE_URL/health"

    # Prediction test
    - >
      curl --fail -X POST
      "$SERVICE_URL/predict"
      -H "Content-Type: application/json"
      -d '{"texts":["Congratulations! You won a free prize","Hey, are we still meeting tomorrow?"]}'

  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH


    