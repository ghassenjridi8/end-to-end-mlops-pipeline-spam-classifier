stages:
  - lint
  - train
  - evaluate
  - register 
  - build
  - deploy
  - integration_tests

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

  #GCP config  
  GCP_PROJECT_ID: "project-46677838-a710-49db-be5"
  GCP_PROJECT_NUMBER: "773233738701"
  GCP_REGION: "europe-west3"
  GCP_SERVICE_ACCOUNT: "gitlab-ci@project-46677838-a710-49db-be5.iam.gserviceaccount.com"
  CLOUD_RUN_SERVICE_ACCOUNT: "spam-classifier-runtime@project-46677838-a710-49db-be5.iam.gserviceaccount.com"
  GCP_WIF_PROVIDER: "projects/773233738701/locations/global/workloadIdentityPools/gitlab-pool/providers/gitlab-provider"
  GCP_WIF_AUDIENCE: "https://iam.googleapis.com/projects/773233738701/locations/global/workloadIdentityPools/gitlab-pool/providers/gitlab-provider"

  #storage
  GCS_BUCKET: "spam-classifier-mlops-project-ghassen"

  #cloud run 
  ARTIFACT_REPOSITORY: "spam-classifier"
  IMAGE_NAME: "spam-classifier"
  CLOUD_RUN_SERVICE: "spam-classifier"

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install ruff
    - ruff check src/

train:
  stage: train
  image: google/cloud-sdk:slim

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: $GCP_WIF_AUDIENCE

  script:
    - echo "$GITLAB_OIDC_TOKEN" > /tmp/gitlab-oidc-token

    - gcloud iam workload-identity-pools create-cred-config $GCP_WIF_PROVIDER --service-account=$GCP_SERVICE_ACCOUNT --output-file=/tmp/gcp-credentials.json --credential-source-file=/tmp/gitlab-oidc-token

    - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-credentials.json

    - gcloud auth login --cred-file=/tmp/gcp-credentials.json

    - apt-get update && apt-get install -y python3-pip

    - pip3 install --break-system-packages -r requirements.txt

    - python3 src/train.py --dataset gs://$GCS_BUCKET/data/messages.csv --output model.pkl

    - gcloud storage cp model.pkl gs://$GCS_BUCKET/models/$CI_COMMIT_SHA/model.pkl

  artifacts:
    paths:
      - model.pkl

evaluate:
  stage: evaluate
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - python src/evaluate.py

register:
  stage: register
  image: google/cloud-sdk:slim

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: $GCP_WIF_AUDIENCE

  script:
    - echo "$GITLAB_OIDC_TOKEN" > /tmp/gitlab-oidc-token

    - gcloud iam workload-identity-pools create-cred-config $GCP_WIF_PROVIDER --service-account=$GCP_SERVICE_ACCOUNT --output-file=/tmp/gcp-credentials.json --credential-source-file=/tmp/gitlab-oidc-token

    - gcloud auth login --cred-file=/tmp/gcp-credentials.json

    - echo "Ready to register model from gs://$GCS_BUCKET/models/$CI_COMMIT_SHA/"



build:
  stage: build
  image: google/cloud-sdk:slim

  services:
    - docker:27-dind

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: $GCP_WIF_AUDIENCE

  script:
    - apt-get update && apt-get install -y docker.io

    - echo "$GITLAB_OIDC_TOKEN" > /tmp/gitlab-oidc-token

    - gcloud iam workload-identity-pools create-cred-config $GCP_WIF_PROVIDER --service-account=$GCP_SERVICE_ACCOUNT --output-file=/tmp/gcp-credentials.json --credential-source-file=/tmp/gitlab-oidc-token

    - gcloud auth login --cred-file=/tmp/gcp-credentials.json

    - docker info

    - gcloud auth configure-docker $GCP_REGION-docker.pkg.dev --quiet

    - docker build -t $GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$IMAGE_NAME:$CI_COMMIT_SHA .

    - docker push $GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$IMAGE_NAME:$CI_COMMIT_SHA


deploy:
  stage: deploy
  image: google/cloud-sdk:slim

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: $GCP_WIF_AUDIENCE

  script:
    - echo "$GITLAB_OIDC_TOKEN" > /tmp/gitlab-oidc-token

    - gcloud iam workload-identity-pools create-cred-config $GCP_WIF_PROVIDER --service-account=$GCP_SERVICE_ACCOUNT --output-file=/tmp/gcp-credentials.json --credential-source-file=/tmp/gitlab-oidc-token

    - gcloud auth login --cred-file=/tmp/gcp-credentials.json

    - gcloud run deploy $CLOUD_RUN_SERVICE --project=$GCP_PROJECT_ID --image=$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$ARTIFACT_REPOSITORY/$IMAGE_NAME:$CI_COMMIT_SHA --region=$GCP_REGION --platform=managed --allow-unauthenticated --service-account=$CLOUD_RUN_SERVICE_ACCOUNT

    - echo "SERVICE_URL=$(gcloud run services describe $CLOUD_RUN_SERVICE --project=$GCP_PROJECT_ID --region=$GCP_REGION --format='value(status.url)')" > deploy.env
  artifacts:
    reports:
      dotenv: deploy.env


integration_tests:
  stage: integration_tests
  image: curlimages/curl:latest

  script:
    # Health check
    - curl --fail "$SERVICE_URL/health"

    # Prediction test
    - >
      curl --fail -X POST
      "$SERVICE_URL/predict"
      -H "Content-Type: application/json"
      -d '{"texts":["Congratulations! You won a free prize","Hey, are we still meeting tomorrow?"]}'



