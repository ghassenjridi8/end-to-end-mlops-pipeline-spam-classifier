stages:
  - lint
  - train
  - evaluate
  - register 
  - build

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install ruff
    - ruff check src/

train:
  stage: train
  image: google/cloud-sdk:slim

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://iam.googleapis.com/projects/773233738701/locations/global/workloadIdentityPools/gitlab-pool/providers/gitlab-provider

  script:
    - echo "$GITLAB_OIDC_TOKEN" > /tmp/gitlab-oidc-token

    - gcloud iam workload-identity-pools create-cred-config projects/773233738701/locations/global/workloadIdentityPools/gitlab-pool/providers/gitlab-provider --service-account=gitlab-ci@project-46677838-a710-49db-be5.iam.gserviceaccount.com --output-file=/tmp/gcp-credentials.json --credential-source-file=/tmp/gitlab-oidc-token

    - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp-credentials.json

    - gcloud auth login --cred-file=/tmp/gcp-credentials.json

    - apt-get update && apt-get install -y python3-pip

    - pip3 install --break-system-packages -r requirements.txt

    - python3 src/train.py --dataset gs://spam-classifier-mlops-project-ghassen/data/messages.csv --output model.pkl

    - gcloud storage cp model.pkl gs://spam-classifier-mlops-project-ghassen/models/$CI_COMMIT_SHA/model.pkl

  artifacts:
    paths:
      - model.pkl

evaluate:
  stage: evaluate
  image: python:3.12-slim
  script:
    - pip install -r requirements.txt
    - python src/evaluate.py

register:
  stage: register
  image: google/cloud-sdk:slim

  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://iam.googleapis.com/projects/773233738701/locations/global/workloadIdentityPools/gitlab-pool/providers/gitlab-provider

  script:
    - echo "$GITLAB_OIDC_TOKEN" > /tmp/gitlab-oidc-token

    - gcloud iam workload-identity-pools create-cred-config projects/773233738701/locations/global/workloadIdentityPools/gitlab-pool/providers/gitlab-provider --service-account=gitlab-ci@project-46677838-a710-49db-be5.iam.gserviceaccount.com --output-file=/tmp/gcp-credentials.json --credential-source-file=/tmp/gitlab-oidc-token

    - gcloud auth login --cred-file=/tmp/gcp-credentials.json

    - echo "Ready to register model from gs://spam-classifier-mlops-project-ghassen/models/$CI_COMMIT_SHA/"


build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind

  script:
    - docker info
    - docker build -t spam-classifier:$CI_COMMIT_SHA .


